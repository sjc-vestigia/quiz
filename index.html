<body>
<main id="stage">
  <svg id="map" aria-hidden="true" focusable="false"></svg>
  <div class="vignette"></div>

  <div id="intro" aria-hidden="true">
    <div class="intro-photo"></div>
    <div class="intro-clouds"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <section id="panel"></section>

  <div id="reveal-layer" hidden>
    <img class="vault" id="vault-plate" alt="" hidden>
    <div class="dust" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="reward-host" data-reward hidden></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script type="module" src="js/main.js"></script>
<script>
  // If the modules never run (stale cache mixing old JS with new HTML, or a
  // failed fetch), say so instead of leaving an empty screen.
  setTimeout(function () {
    if (!window.__vestigiaBooted) document.body.classList.add('boot-failed');
  }, 4000);
</script>
</body>
